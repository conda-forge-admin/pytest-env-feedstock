schema_version: 1

context:
  name: pytest-env
  version: "1.8.5"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 992c37efdc1bde2f0783975080ac4cdcea85f36df9d6fe3a835edd01a7e06584
  file_name: ${{ name }}-${{ version }}.tar.gz

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - hatch-fancy-pypi-readme >=25.1
    - hatch-vcs >=0.5
    - hatchling >=1.32.4
  run:
    - python >=${{ python_min }}
    - pytest >=9.1.1
    - python-dotenv >=1.2.4

tests:
  - python:
      imports:
        - pytest_env.plugin
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - pytest --help

about:
  license: MIT
  license_file: LICENSE
  summary: This is a pytest plugin that enables you to set environment variables in a pytest.ini or pyproject.toml file.
  homepage: https://github.com/pytest-dev/pytest-env
  repository: https://github.com/pytest-dev/pytest-env

extra:
  recipe-maintainers:
    - nicoddemus
